<!DOCTYPE html>
<html>
<head>
  <title>Simple Semantic Example</title>
</head>
<body>
<header>
  <h1>My Website</h1>
  <nav><a href="#">Home</a></nav>
</header>
<main>
  <section>
    <article>
      <h2>Post Title</h2>
      <p>Published on <time datetime="2026-02-27">Feb 27, 2026</time></p>
      <p>This is <mark>important</mark> text.</p>
      <figure>
        <img src="image.jpg" alt="Sample" width="150">
        <figcaption>Sample Image</figcaption>
      </figure>
      <details>
        <summary>More</summary>
        <p>Extra details here.</p>
      </details>
      <footer>Author: John</footer>
    </article>
  </section>
  <aside>Related info</aside>
</main>
<footer>© 2026</footer>
</body>
</html>
